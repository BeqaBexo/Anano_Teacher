<!-- schedule.html -->
<section id="schedule" class="schedule-section">
    <h2 id="scheduleTitle">Weekly Schedule</h2>
    <div class="schedule-grid">
        <div class="schedule-card">
            <h3 id="monday">Monday</h3>
            <p id="mondayTime">10:00 AM - 12:00 PM</p>
        </div>
        <div class="schedule-card">
            <h3 id="wednesday">Wednesday</h3>
            <p id="wednesdayTime">2:00 PM - 4:00 PM</p>
        </div>
        <div class="schedule-card">
            <h3 id="friday">Friday</h3>
            <p id="fridayTime">11:00 AM - 1:00 PM</p>
        </div>
    </div>
</section>
